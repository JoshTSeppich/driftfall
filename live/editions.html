<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftfall editions</title>
<style>
  body { margin: 0; padding: 24px; background: #171326; color: #e8e4f4; font: 15px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; letter-spacing: .08em; } p { color: #b9b3d6; margin: 0 0 18px; }
  ul { list-style: none; padding: 0; max-width: 820px; }
  li { padding: 10px 14px; margin-bottom: 8px; background: #26223c; border: 1px solid #4a4568; border-radius: 4px; }
  li.latest { border-color: #33e0ff; }
  a { color: #33e0ff; font-weight: 600; text-decoration: none; } a:hover { text-decoration: underline; }
  small { color: #7e78a0; display: block; }
</style>
</head>
<body>
<h1>DRIFTFALL EDITIONS</h1>
<p>Every green build is kept. Open any edition to play exactly that version (archived editions never auto-reload).</p>
<ul id="list"><li>Loading editions...</li></ul>
<script>
const list = document.getElementById('list');
fetch('../editions/index.json', { cache: 'no-store' }).then((r) => r.json()).then((eds) => {
  list.textContent = '';
  if (!eds.length) { list.innerHTML = '<li>No editions yet. The first green build creates one.</li>'; return; }
  eds.forEach((e, i) => {
    const li = document.createElement('li'); if (i === 0) li.className = 'latest';
    const a = document.createElement('a'); a.href = '../' + e.path; a.textContent = 'Edition ' + e.build + (i === 0 ? ' (latest)' : '');
    const s = document.createElement('small'); s.textContent = (e.at || '').replace('T', ' ').slice(0, 16) + ' UTC. ' + (e.what || e.headline || '');
    li.append(a, s); list.append(li);
  });
}).catch(() => { list.innerHTML = '<li>No editions yet. The first green build creates one.</li>'; });
</script>
</body>
</html>
