<!doctype html>
<!-- Driftfall Classic: play live against the bot (owner: sonnet, Playable Client).
     Open play/index.html from the repo-root server. Query: ?ai=sonnet|haiku|fable|sample  ?seed=7  ?ticks=21600  ?quality=low  ?mute=1
     Mouse: drag = box select (12 max), click, double-click = all of that kind, right-click = smart command (move / attack / mine / rally),
            wheel = zoom, screen edges or arrows = scroll, minimap click = move camera, minimap right-click = command.
     Keys:  A attack-move then click, S stop, H hold, M move then click, Shift = queue, building hotkeys (F, T) then click to place
            (green = ok, red = blocked), training hotkeys on a selected building (shown on the buttons), R rally then click,
            Ctrl+1..9 make a group, 1..9 recall (twice = centre), Space = last alert, P pause, Esc cancel, + / - zoom. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftfall Classic</title>
<script type="importmap">{ "imports": {
  "three": "./d956dde608/node_modules/three/build/three.module.js",
  "three/addons/": "./d956dde608/node_modules/three/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #171326; color: #e8e4f4; font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
  #stage, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 22px; align-items: baseline; padding: 6px 14px; background: linear-gradient(#0009, #0000); pointer-events: none; }
  .watch #bottom { display: none; } .watch #top { justify-content: space-between; padding: 4px 18px; background: #0b0918cc; font-size: 15px; }
  .watch #top .wc { color: #b9b3d6; } .watch #top .ws b { margin-right: 6px; font-size: 15px; color: inherit; }
  #top .res { color: #b9b3d6; } #top b { color: #33e0ff; font-size: 16px; } #alert { color: #ffb13b; font-weight: 600; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: 168px; display: flex; gap: 10px; padding: 4px 10px; box-sizing: border-box; background: linear-gradient(#0000, #0b0918 22%); align-items: flex-end; }
  #bottom { pointer-events: none; } #bottom > * { pointer-events: auto; } #selection { pointer-events: none; } #selection button { pointer-events: auto; }
  #minimap { width: 160px; height: 160px; border: 2px solid #4a4568; background: #10131d; cursor: pointer; }
  #selection { flex: 1; min-width: 200px; align-self: stretch; padding: 22px 8px 4px; }
  #selection .dim, .dim { color: #7e78a0; } .foe { color: #ff7a5a; }
  .bar { height: 6px; width: 180px; background: #2a2640; margin: 4px 0; } .bar i { display: block; height: 100%; background: #5dff7a; }
  .chips span { display: inline-block; margin: 2px 6px 2px 0; padding: 1px 7px; background: #26223c; border-radius: 3px; }
  #card { display: grid; grid-template-columns: repeat(4, 76px); gap: 4px; align-content: end; padding-bottom: 4px; }
  #card button { font: inherit; color: #e8e4f4; background: #26223c; border: 1px solid #4a4568; padding: 6px 4px; cursor: pointer; text-align: left; }
  #card button:hover { background: #342f52; } #card button.poor { color: #ff8f8f; } #card button.on { border-color: #ffe14a; }
  #card kbd { background: #0b0918; padding: 0 5px; border-radius: 3px; color: #ffe14a; } #card small { color: #7e78a0; }
  #card .cc { height: 66px; padding: 2px; text-align: center; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 11px; line-height: 1.1; }
  #card .cc.empty { background: #14112299; border: 1px dashed #2a2640; display: block; pointer-events: none; }
  #card .cc .command-icon { width: 30px; height: 30px; } #card .cc .lbl { display: block; } #card .cc kbd { font-size: 10px; padding: 0 3px; }
  .portrait { display: block; } .sel-single { display: flex; gap: 10px; align-items: flex-start; } .sel-info { display: flex; flex-direction: column; }
  .item-slots { display: flex; gap: 4px; margin-top: 4px; } .slot { width: 26px; height: 26px; border: 2px solid #1d1a14; border-radius: 4px; background: #e9d9b0; color: #1d1a14; font: 700 13px system-ui; padding: 0; cursor: help; }
  .slot.empty { background: transparent; border-style: dashed; border-color: #6b6657; color: #6b6657; text-align: center; line-height: 22px; }
  .rank { color: #ffd45c; text-shadow: 0 0 2px #1d1a14; letter-spacing: 1px; }
  .sel-multi .picks { display: flex; flex-wrap: wrap; gap: 3px; max-width: 420px; margin-top: 4px; }
  .pick { background: #26223c; border: 1px solid #4a4568; padding: 2px; cursor: pointer; } .pick:hover { border-color: #ffe14a; }
  .bar.sm { width: 40px; height: 4px; margin: 2px 0 0; }
  #territory { position: fixed; right: 10px; top: 34px; width: 230px; padding: 6px 10px; background: #0b0918cc; border: 1px solid #4a4568; border-radius: 4px; font-size: 12px; pointer-events: none; }
  #territory[hidden] { display: none; } #territory .tier { margin-bottom: 4px; } #territory .flow-row { display: flex; gap: 8px; justify-content: space-between; }
  #territory .drift { padding: 3px 6px; margin-bottom: 4px; background: #3a2a10; color: #ffb13b; font-weight: 700; border-radius: 3px; } #territory .drift.incoming { background: #4a1a1a; color: #ff8f6a; }
  #territory .bank.debt { font-weight: 700; }
  #toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); padding: 6px 14px; background: #000a; border-radius: 4px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000a; text-align: center; }
  #result[hidden] { display: none; } #result h1 { font-size: 64px; letter-spacing: .12em; margin: 0; } .win { color: #5dff7a; } .lose { color: #ff5d5d; }
  #boot { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #b9b3d6; } #boot b { color: #33e0ff; letter-spacing: .08em; }
  #boot.error { color: #ffb13b; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import * as THREE from 'three';
import { createEngine, createPlaceholder } from './d956dde608/viewer3d/engine.mjs';
import { startGame } from './d956dde608/play/app.mjs';
const root = document.getElementById('root');
try {
  await startGame({ THREE, createEngine, createPlaceholder, root, query: new URLSearchParams(location.search) });
} catch (err) {
  console.error(err);
  const boot = root.querySelector('#boot') ?? root;
  boot.hidden = false; boot.classList.add('error');
  boot.innerHTML = `<b>DRIFTFALL</b><br>could not start<br><small>${String(err?.message ?? err)}</small>`;
}
</script>
</body>
</html>
