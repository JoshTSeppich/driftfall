<div id="ui"><b style="align-self:center">CUTE SPEC v1.0 (GPT)</b><button data-e="determined" aria-pressed="true">Determined</button><button data-e="happy">Happy</button><button data-e="alarmed">Alarmed</button><button id="team">Team: cyan</button><button id="hop" aria-pressed="true">Roll</button></div>
<script type="module">

function mat(c,part){const hex=c==='team'?PALETTE[team]:PALETTE[c]; const m=new THREE.MeshStandardMaterial({color:hex,roughness:rough[c]??0.5,metalness:c==='charcoal'?0.08:c==='feet'?0.1:0});

function build(kind,ox){const root=new THREE.Group(); root.position.x=ox; const parts=TOASTERS[kind].map(p=>({...p})); const body=parts[0];
 const W=body.size[0], H=body.size[1], D=body.size[2], isWheel=kind==='bagel';
 const lift = isWheel?0:WHEELS.lift*WHEELS.diameterOfBodyH*H;

   w.position.set(sx*(W/2+WHEELS.outsideSides*W-tw/2), dia/2, sz*(D/2-WHEELS.frontInset*D)); root.add(w); wheels.push(w);} }

 const exitY=lift+CORD.exitHeightOfBodyH*H, back=-D/2; const pts=[];

 const tail=[[0.25,CORD.radius,back-CORD.coilLength-0.35],[W/2+0.55,CORD.radius,back-0.6],[W/2+0.95,CORD.radius,back+0.4],[W/2+1.15,CORD.radius,D/2+0.9],[W/2+1.0,CORD.radius,D/2+1.9]];

function rebuild(){for(const u of units) scene.remove(u.root); units.length=0; const order=['crumb','popper','zapper','four-slice','broiler','flak-popper','bagel']; let x=-14; for(const k of order){const w=TOASTERS[k][0].size[0]; x+=w/2; build(k,x); x+=w/2+2.4;} applyExpr();}

 for(const c of u.root.children){const p=c.userData.part; if(!p||p.name!=='eye') continue; const s=Math.sign(c.position.x)||1; const fw=face.size[0], fh=face.size[1];

rebuild();
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{expr=b.dataset.e; document.querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',x===b)); applyExpr();});
document.getElementById('team').onclick=e=>{team=team==='cyan'?'orange':'cyan'; e.target.textContent='Team: '+team; rebuild();};
